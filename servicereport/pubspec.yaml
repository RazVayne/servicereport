name: servicereport
description: "A custom mobile service report generator"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  forui: ^0.27.6
  forui_lucide: ^0.27.0
  go_router: ^18.0.0
  google_sign_in: ^7.2.0
  pdf: ^3.13.0
  shared_preferences: ^2.5.5
  signals: ^7.1.0
  upgrade: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  signals_lint: ^7.0.0

flutter:
  uses-material-design: true
