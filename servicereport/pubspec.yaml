name: servicereport
description: "A custom mobile service report generator"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  forui: ^0.27.6
  forui_lucide: ^0.27.0
  go_router: ^18.0.0
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  google_sign_in_web: ^1.1.3
  material_ui: ^1.8.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  shared_preferences: ^2.5.5
  signals: ^7.1.0
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  sqflite_common_ffi_web: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  signals_lint: ^7.0.0

flutter:
  uses-material-design: true
